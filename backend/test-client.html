<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Chat App Real-Time Test</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .chat-box { height: 400px; border: 1px solid #ccc; padding: 10px; overflow-y: scroll; margin-bottom: 10px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        input, button { padding: 8px; }
        input[type="text"] { flex: 1; }
        .message { margin: 5px 0; padding: 8px; background: #f5f5f5; border-radius: 4px; }
        .my-message { background: #007bff; color: white; }
        .status { color: #666; font-style: italic; }
        .online-users { background: #e9ecef; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chat App - Real-Time Test</h1>
        
        <div class="input-group">
            <input type="text" id="token" placeholder="JWT Token" style="width: 400px;">
            <button onclick="connect()">Connect</button>
            <button onclick="disconnect()">Disconnect</button>
        </div>

        <div class="online-users">
            <strong>Online Users:</strong> <span id="onlineUsers">None</span>
        </div>

        <div class="input-group">
            <input type="number" id="conversationId" placeholder="Conversation ID" value="1">
            <button onclick="joinConversation()">Join Conversation</button>
        </div>

        <div class="chat-box" id="chatBox"></div>

        <div class="input-group">
            <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>

        <div class="input-group">
            <button onclick="startTyping()">Start Typing</button>
            <button onclick="stopTyping()">Stop Typing</button>
        </div>
    </div>

    <script>
        let socket = null;
        let currentConversationId = null;
        const onlineUsers = new Set();

        function addMessage(message, isOwn = false) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isOwn ? 'my-message' : ''}`;
            messageDiv.innerHTML = message;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addStatus(message) {
            addMessage(`<span class="status">${message}</span>`);
        }

        function updateOnlineUsers() {
            document.getElementById('onlineUsers').textContent = 
                onlineUsers.size > 0 ? Array.from(onlineUsers).join(', ') : 'None';
        }

        function connect() {
            const token = document.getElementById('token').value;
            if (!token) {
                alert('Please enter a JWT token');
                return;
            }

            socket = io('http://localhost:3000', {
                auth: { token }
            });

            socket.on('connect', () => {
                addStatus('✅ Connected to server');
            });

            socket.on('disconnect', () => {
                addStatus('❌ Disconnected from server');
                onlineUsers.clear();
                updateOnlineUsers();
            });

            socket.on('user_online', (data) => {
                onlineUsers.add(data.userInfo.username);
                updateOnlineUsers();
                addStatus(`👤 ${data.userInfo.username} is online`);
            });

            socket.on('user_offline', (data) => {
                // Note: We don't have username in offline event, so we can't remove from display
                addStatus(`👤 User ${data.userId} went offline`);
            });

            socket.on('new_message', (message) => {
                addMessage(`<strong>${message.sender.username}:</strong> ${message.content}`);
            });

            socket.on('message_updated', (message) => {
                addStatus(`📝 Message updated: ${message.content}`);
            });

            socket.on('message_deleted', (data) => {
                addStatus(`🗑️ Message ${data.messageId} was deleted`);
            });

            socket.on('user_typing', (data) => {
                addStatus(`⌨️ ${data.userInfo.username} is typing...`);
            });

            socket.on('user_stopped_typing', (data) => {
                addStatus(`✋ User stopped typing`);
            });

            socket.on('connect_error', (error) => {
                addStatus(`❌ Connection error: ${error.message}`);
            });
        }

        function disconnect() {
            if (socket) {
                socket.disconnect();
                socket = null;
            }
        }

        function joinConversation() {
            const conversationId = document.getElementById('conversationId').value;
            if (!socket || !conversationId) {
                alert('Please connect first and enter a conversation ID');
                return;
            }

            if (currentConversationId) {
                socket.emit('leave_conversation', currentConversationId);
            }

            currentConversationId = conversationId;
            socket.emit('join_conversation', conversationId);
            addStatus(`🚪 Joined conversation ${conversationId}`);
        }

        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();
            
            if (!message || !currentConversationId) {
                alert('Please enter a message and join a conversation first');
                return;
            }

            // Send via HTTP API (this will trigger the real-time event)
            const token = document.getElementById('token').value;
            fetch('http://localhost:3000/api/v1/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    content: message,
                    conversation_id: parseInt(currentConversationId)
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    addMessage(`<strong>You:</strong> ${message}`, true);
                    messageInput.value = '';
                } else {
                    addStatus(`❌ Error sending message: ${data.message}`);
                }
            })
            .catch(error => {
                addStatus(`❌ Error: ${error.message}`);
            });
        }

        function startTyping() {
            if (socket && currentConversationId) {
                socket.emit('typing_start', { conversationId: currentConversationId });
                addStatus('⌨️ You started typing');
            }
        }

        function stopTyping() {
            if (socket && currentConversationId) {
                socket.emit('typing_stop', { conversationId: currentConversationId });
                addStatus('✋ You stopped typing');
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Example tokens and instructions
        window.onload = function() {
            addStatus('📋 Instructions:');
            addStatus('1. Get a JWT token by logging in via API');
            addStatus('2. Paste the token and click Connect');
            addStatus('3. Enter a conversation ID and join');
            addStatus('4. Start chatting!');
            addStatus('');
            addStatus('💡 Open multiple tabs to test real-time messaging');
        };
    </script>
</body>
</html>
