<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; max-width: 600px; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, button { padding: 10px; margin: 5px 0; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; }
        button { background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #0056b3; }
        .result { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 4px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
    </style>
</head>
<body>
    <h1>Auth API Test</h1>
    
    <div class="form-group">
        <label>Server URL:</label>
        <input type="text" id="serverUrl" value="http://localhost:3000" placeholder="http://localhost:3000">
    </div>

    <h2>Login Test</h2>
    <div class="form-group">
        <label>Email:</label>
        <input type="email" id="email" placeholder="user@example.com">
    </div>
    
    <div class="form-group">
        <label>Password:</label>
        <input type="password" id="password" placeholder="password123">
    </div>
    
    <button onclick="testLogin()">Test Login</button>
    <button onclick="testGetLogin()">Test GET Login (should show info)</button>
    
    <div id="result"></div>

    <script>
        function showResult(data, isSuccess = true) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = `result ${isSuccess ? 'success' : 'error'}`;
            resultDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        }

        async function testLogin() {
            const serverUrl = document.getElementById('serverUrl').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showResult({ error: 'Please enter email and password' }, false);
                return;
            }

            try {
                const response = await fetch(`${serverUrl}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                showResult(data, response.ok);
            } catch (error) {
                showResult({ error: error.message }, false);
            }
        }

        async function testGetLogin() {
            const serverUrl = document.getElementById('serverUrl').value;

            try {
                const response = await fetch(`${serverUrl}/api/v1/auth/login`, {
                    method: 'GET'
                });

                const data = await response.json();
                showResult(data, response.ok);
            } catch (error) {
                showResult({ error: error.message }, false);
            }
        }
    </script>
</body>
</html>
